# GitHub Pages (Jekyll) settings.
# Quarto and R Markdown sources start with a YAML header, so Jekyll tries to
# run them through its Liquid template engine and fails on the code inside.
# Only their rendered HTML needs to be published.
exclude:
  - institution-reports/report.qmd
  - institution-reports/index.qmd
  - Research-example/Hunter-code-sample.Rmd
  - "**/*.qmd"
  - "**/*.Rmd"
  - naep-differences/index.qmd
